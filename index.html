<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06192e">
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <!-- TextureLoader fetches these as CORS-anonymous images (three's Loader default). The build appends the same ?v= hash publicAssetUrl uses, so the preload is reused. -->
    <link rel="preload" as="image" href="%BASE_URL%book-images/cover-atlas.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="%BASE_URL%experience/shelf/Wood051_1K-JPG_Color.webp" crossorigin="anonymous" />
    <title>Boooks x Threejs</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #080d1a;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 2500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 48%,
          #0e172c 0%,
          #070b17 58%,
          #03050b 100%
        );
      }

      #boot img {
        width: 160px;
        height: auto;
        user-select: none;
        filter: drop-shadow(0 8px 28px rgba(226, 36, 36, 0.22));
      }

      #boot .boot-track {
        height: 3px;
        width: 144px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      #boot .boot-fill {
        height: 100%;
        width: 100%;
        transform-origin: left center;
        transform: scaleX(0.16);
        border-radius: 999px;
        background: linear-gradient(90deg, #7c1414, #d91b24, #ff4d4d);
        box-shadow: 0 0 12px rgba(226, 36, 36, 0.75);
      }

      @media (min-width: 640px) {
        #boot img {
          width: 192px;
        }

        #boot .boot-track {
          width: 176px;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading books">
      <img src="%BASE_URL%icons/wordmark-gradient.svg" alt="Boooks" />
      <div class="boot-track" aria-hidden="true">
        <div class="boot-fill"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
